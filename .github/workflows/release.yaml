name: Release
on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitOps environment to update
        required: true
        type: choice
        options: [staging, production]
      image_tag:
        description: Existing immutable image tag to promote
        required: false
permissions:
  id-token: write
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
jobs:
  build:
    if: inputs.image_tag == ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [control-api, redirect, event-processor, analytics-api, topic-init]
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: SERVICE=${{ matrix.service }}
          tags: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/uzip-${{ matrix.service }}:${{ env.IMAGE_TAG }}
          provenance: true
          sbom: true
  dashboard:
    if: inputs.image_tag == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          build-args: |
            NEXT_PUBLIC_DEV_AUTH=false
            NEXT_PUBLIC_CONTROL_API=https://${{ vars.API_DOMAIN }}
            NEXT_PUBLIC_ANALYTICS_API=https://${{ vars.ANALYTICS_DOMAIN }}
            NEXT_PUBLIC_REDIRECT_URL=https://${{ vars.REDIRECT_DOMAIN }}
            NEXT_PUBLIC_COGNITO_DOMAIN=${{ vars.COGNITO_DOMAIN }}
            NEXT_PUBLIC_COGNITO_CLIENT_ID=${{ vars.COGNITO_CLIENT_ID }}
            NEXT_PUBLIC_COGNITO_REDIRECT_URI=https://${{ vars.APP_DOMAIN }}/auth/callback
            NEXT_PUBLIC_COGNITO_LOGOUT_URI=https://${{ vars.APP_DOMAIN }}
          tags: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/uzip-dashboard:${{ env.IMAGE_TAG }}
          provenance: true
          sbom: true
  gitops:
    runs-on: ubuntu-latest
    needs: [build, dashboard]
    if: always() && (inputs.image_tag != '' || (needs.build.result == 'success' && needs.dashboard.result == 'success'))
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Update image tag
        env:
          TARGET: ${{ inputs.environment || 'staging' }}
        run: |
          FILE="deploy/helm/uzip/values-${TARGET}.yaml"
          sed -i "s/^  imageTag:.*/  imageTag: ${IMAGE_TAG}/" "$FILE"
          git config user.name "uzip-release[bot]"
          git config user.email "uzip-release[bot]@users.noreply.github.com"
          git add "$FILE"
          git diff --cached --quiet || git commit -m "deploy(${TARGET}): ${IMAGE_TAG}"
          git push
