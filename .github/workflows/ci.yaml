name: CI
on:
  pull_request:
  push:
    branches: [main]
  schedule: [{ cron: "30 4 * * 1" }]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - run: gofmt -l cmd internal | tee /tmp/gofmt && test ! -s /tmp/gofmt
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go build ./cmd/...
  dashboard:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
  integration:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - run: bash scripts/test-integration.sh
  containers:
    if: github.event_name == 'push'
    needs: [backend, dashboard, integration]
    runs-on: ubuntu-latest
    strategy:
      matrix: { service: [control-api, redirect, event-processor, analytics-api, topic-init] }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: SERVICE=${{ matrix.service }}
          tags: uzip-${{ matrix.service }}:${{ github.sha }}
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: ''
          go-version-file: go.mod
          go-package: ./...
          repo-checkout: 'false'
      - uses: gitleaks/gitleaks-action@v3
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: ${{ !cancelled() }}
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
