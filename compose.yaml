name: uzip
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: uzip
      POSTGRES_PASSWORD: uzip
      POSTGRES_DB: uzip
    ports: ["${UZIP_POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uzip"]
      interval: 3s
      timeout: 3s
      retries: 20

  postgres-role-init:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: uzip
    command: ["psql", "-h", "postgres", "-U", "uzip", "-d", "uzip", "-v", "ON_ERROR_STOP=1", "-f", "/init/003_local_role_grants.sql"]
    volumes:
      - ./migrations/postgres/003_local_role_grants.sql:/init/003_local_role_grants.sql:ro
    depends_on:
      postgres: { condition: service_healthy }

  redis:
    image: redis:7.4-alpine
    ports: ["${UZIP_REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  kafka:
    image: redpandadata/redpanda:v24.3.18
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr=internal://kafka:29092,external://localhost:${UZIP_KAFKA_PORT:-9092}
    ports: ["${UZIP_KAFKA_PORT:-9092}:9092", "${UZIP_KAFKA_ADMIN_PORT:-9644}:9644"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka-init:
    image: redpandadata/redpanda:v24.3.18
    entrypoint: ["/bin/sh", "-c"]
    command: ["rpk topic create clicks.raw.v1 clicks.dlq.v1 --brokers kafka:29092 || true"]
    depends_on:
      kafka: { condition: service_healthy }

  clickhouse:
    image: clickhouse/clickhouse-server:25.3-alpine
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: uzip
    ports: ["${UZIP_CLICKHOUSE_HTTP_PORT:-8123}:8123", "${UZIP_CLICKHOUSE_PORT:-9000}:9000"]
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./migrations/clickhouse:/docker-entrypoint-initdb.d:ro
      - ./config/clickhouse/listen.xml:/etc/clickhouse-server/config.d/listen.xml:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--password", "uzip", "--query", "SELECT 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  clickhouse-schema-init:
    image: clickhouse/clickhouse-server:25.3-alpine
    command: ["/bin/sh", "-ec", "clickhouse-client --host clickhouse --password uzip --multiquery < /init/001_initial.sql"]
    volumes:
      - ./migrations/clickhouse/001_initial.sql:/init/001_initial.sql:ro
    depends_on:
      clickhouse: { condition: service_healthy }

  control-api:
    build:
      context: .
      args: { SERVICE: control-api }
    environment: &service-env
      POSTGRES_URL: postgres://uzip_app:change-me-in-production@postgres:5432/uzip?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      KAFKA_BROKERS: kafka:29092
      KAFKA_IAM: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_DATABASE: uzip
      CLICKHOUSE_PASSWORD: uzip
      DEV_AUTH: "true"
      REDIRECT_BASE_URL: http://localhost:8081
      ALLOWED_ORIGINS: http://localhost:${UZIP_DASHBOARD_PORT:-3000}
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      postgres-role-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  redirect:
    build:
      context: .
      args: { SERVICE: redirect }
    environment:
      <<: *service-env
      PORT: "8081"
    ports: ["8081:8081"]
    depends_on:
      postgres: { condition: service_healthy }
      postgres-role-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  event-processor:
    build:
      context: .
      args: { SERVICE: event-processor }
    environment:
      <<: *service-env
      PORT: "8082"
    depends_on:
      kafka: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      clickhouse: { condition: service_healthy }
      clickhouse-schema-init: { condition: service_completed_successfully }

  analytics-api:
    build:
      context: .
      args: { SERVICE: analytics-api }
    environment:
      <<: *service-env
      PORT: "8083"
    ports: ["8083:8083"]
    depends_on:
      clickhouse: { condition: service_healthy }
      clickhouse-schema-init: { condition: service_completed_successfully }

  dashboard:
    build: ./web
    ports: ["${UZIP_DASHBOARD_PORT:-3000}:3000"]
    depends_on:
      - control-api
      - analytics-api

  prometheus:
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["${UZIP_PROMETHEUS_PORT:-9090}:9090"]

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana:/etc/grafana/provisioning:ro
    ports: ["${UZIP_GRAFANA_PORT:-3001}:3000"]
    depends_on: [prometheus]

  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["${UZIP_JAEGER_PORT:-16686}:16686", "${UZIP_OTLP_PORT:-4317}:4317"]

volumes:
  postgres-data:
  clickhouse-data:
